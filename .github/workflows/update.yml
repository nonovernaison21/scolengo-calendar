name: Update Calendar

on:
  schedule:
    - cron: '0 6-19 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install scolengo-cli
        run: npm install -g scolengo-cli

      - name: Run script
        env:
          SCOLENGO_TOKEN: ${{ secrets.SCOLENGO_TOKEN }}
        run: python scolengo_to_ics.py

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: ./
